services:
  - type: web
    name: daily-hair-salon
    runtime: python
    plan: free
    buildCommand: python -m zipfile -e source.zip . && pip install -r requirements.txt
    startCommand: python server.py
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: DATABASE_URL
        sync: false
